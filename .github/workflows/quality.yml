name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lock, lint, type, test, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PULSEIQ_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install project Python
        run: uv python install

      - name: Verify lock and synchronize environment
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Verify exported requirements
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt

      - name: Lint and check formatting
        run: |
          uv run --locked ruff check app.py src scripts tests
          uv run --locked ruff format --check app.py src scripts tests

      - name: Type check
        run: uv run --locked mypy

      - name: Run test suite and coverage gate
        run: uv run --locked pytest -q

      - name: Run representative application smoke check
        run: uv run --locked python scripts/smoke_check.py

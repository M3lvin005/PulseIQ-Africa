[theme]
primaryColor = "#3154F5"
backgroundColor = "#F3F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1739"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
runOnSave = false
enableCORS = true
enableXsrfProtection = true

[client]
showErrorDetails = "none"
showErrorLinks = false
toolbarMode = "minimal"

[browser]
gatherUsageStats = false


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseiq-africa"
version = "0.1.0"
description = "Decision-intelligence prototype for governed portfolio analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.73,<2",
    "celery[redis]>=5.6.3,<6",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "plotly>=5.20,<7",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pyarrow>=25.0.1,<26",
    "reportlab>=4,<5",
    "scikit-learn>=1.3,<2",
    "streamlit>=1.36,<2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120,<7",
    "mypy>=1.13,<2",
    "pandas-stubs>=2.2,<4",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pulseiq.audit --cov=pulseiq.datasets --cov=pulseiq.http_security --cov=pulseiq.identity --cov=pulseiq.ingestion --cov=pulseiq.jobs --cov=pulseiq.modeling --cov=pulseiq.portfolio_metrics --cov=pulseiq.postgres --cov=pulseiq.privacy --cov=pulseiq.production_config --cov=pulseiq.rate_limit --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pulseiq.audit", "pulseiq.datasets", "pulseiq.http_security", "pulseiq.identity", "pulseiq.ingestion", "pulseiq.jobs", "pulseiq.modeling", "pulseiq.portfolio_metrics", "pulseiq.postgres", "pulseiq.privacy", "pulseiq.production_config", "pulseiq.rate_limit"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pulseiq"]
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
